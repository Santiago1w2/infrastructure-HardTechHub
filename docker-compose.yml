name: "hardtech-infrastructure"
services:
  postgres:
    image: "postgres:16"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-postgres}"
      POSTGRES_DB: "postgres"
      INVENTORY_POSTGRES_PASSWORD: "${INVENTORY_POSTGRES_PASSWORD:-local-inventory}"
      COMPATIBILITY_POSTGRES_PASSWORD: "${COMPATIBILITY_POSTGRES_PASSWORD:-local-compatibility}"
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - "postgres_business_data:/var/lib/postgresql/data"
      - "./postgres/init:/docker-entrypoint-initdb.d:ro"
      - "./postgres/schemas:/schemas:ro"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U \"$$POSTGRES_USER\" -d postgres"
      interval: "5s"
      timeout: "6s"
      retries: 30
      start_period: "10s"
  mysql:
    image: "mysql:8.0"
    environment:
      MYSQL_DATABASE: "hardtech_orders"
      MYSQL_USER: "orders_app"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-local-orders}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-local-root}"
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - "mysql_business_data:/var/lib/mysql"
      - "./mysql/init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e \"SELECT 1 FROM orders LIMIT 1\""
      interval: "5s"
      timeout: "6s"
      retries: 30
      start_period: "10s"
  mongodb:
    image: "mongo:8"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "mongo_admin"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:-local-mongo-root}"
      CATALOG_MONGO_PASSWORD: "${CATALOG_MONGO_PASSWORD:-local-catalog}"
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - "mongo_business_data:/data/db"
      - "./mongo/init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "--quiet"
        - "--eval"
        - "const c=db.getSiblingDB(\"hardtech_catalog\"); c.auth(\"catalog_app\", process.env.CATALOG_MONGO_PASSWORD); quit(c.counters.findOne({_id:\"products\"}) ? 0 : 1)"
      interval: "5s"
      timeout: "6s"
      retries: 30
      start_period: "10s"
volumes:
  postgres_business_data: {}
  mysql_business_data: {}
  mongo_business_data: {}