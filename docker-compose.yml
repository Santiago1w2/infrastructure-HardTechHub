services:
  postgres:
    image: postgres:16
    container_name: hardtech-postgres
    environment:
      POSTGRES_DB: hardtech_catalog
      POSTGRES_USER: hardtech
      POSTGRES_PASSWORD: hardtech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hardtech -d hardtech_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hardtech-net

  mysql:
    image: mysql:8.0
    container_name: hardtech-mysql
    environment:
      MYSQL_DATABASE: hardtech_orders
      MYSQL_USER: hardtech
      MYSQL_PASSWORD: hardtech
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hardtech-net
volumes:
  postgres_data:
  mysql_data:
  localstack_data:

