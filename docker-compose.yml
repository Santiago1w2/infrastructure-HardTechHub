name: "hardtech-infrastructure"
services:
  postgres:
    image: "postgres:16"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}"
      CATALOG_POSTGRES_PASSWORD: "${CATALOG_POSTGRES_PASSWORD:?Configurar CATALOG_POSTGRES_PASSWORD}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "postgres_business_data:/var/lib/postgresql/data"
      - "./postgres/init:/docker-entrypoint-initdb.d:ro"
      - "./postgres/schemas:/schemas:ro"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U \"$$POSTGRES_USER\" -d postgres"
      interval: "5s"
      timeout: "6s"
      retries: 90
      start_period: "30s"
  mysql:
    image: "mysql:8.0"
    environment:
      MYSQL_DATABASE: "hardtech_orders"
      MYSQL_USER: "orders_app"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Configurar MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Configurar MYSQL_ROOT_PASSWORD}"
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - "mysql_business_data:/var/lib/mysql"
      - "./mysql/init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e \"SELECT 1 FROM orders LIMIT 1\""
      interval: "5s"
      timeout: "6s"
      retries: 90
      start_period: "30s"
  mongodb:
    image: "mongo:8"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "mongo_admin"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?Configurar MONGO_INITDB_ROOT_PASSWORD}"
      INVENTORY_MONGO_PASSWORD: "${INVENTORY_MONGO_PASSWORD:?Configurar INVENTORY_MONGO_PASSWORD}"
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - "mongo_business_data:/data/db"
      - "./mongo/init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "--quiet"
        - "--eval"
        - "const i=db.getSiblingDB(\"hardtech_inventory\"); i.auth(\"inventory_app\", process.env.INVENTORY_MONGO_PASSWORD); quit(i.counters.findOne({_id:\"movements\"}) ? 0 : 1)"
      interval: "5s"
      timeout: "6s"
      retries: 90
      start_period: "30s"
volumes:
  postgres_business_data: {}
  mysql_business_data: {}
  mongo_business_data: {}